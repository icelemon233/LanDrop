name: Check and build Windows app
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
      - run: python scripts/build_installer.py
      - run: python scripts/test_installer.py
      - name: Test custom native interface and upgrade recovery
        shell: pwsh
        run: ./installer/inno/test-custom.ps1 -PayloadDirectory build/inno-payload -Version ((Get-Content landrop/version.json -Raw | ConvertFrom-Json).version)
      - uses: actions/upload-artifact@v4
        with:
          name: LanDrop-Windows-x64
          path: dist/*.exe
